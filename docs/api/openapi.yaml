openapi: 3.0.3
info:
  title: ArbTrade API
  description: |
    Contrato do backend REST consumido pelo frontend (boilerplate Next.js 16).

    Regras do envelope (toda resposta, sucesso e erro):
    - `success` (boolean) e `message` (string) são SEMPRE presentes.
    - `data` carrega o payload específico do endpoint (opcional).
    - Erros usam status HTTP coerente e `message` em PT-BR (texto seguro p/ UI).
    - O front NUNCA decodifica o JWT: a identidade vem do cookie de sessão.

    Autenticação:
    - Login/logout são chamadas browser-direct: o backend emite/limpa os cookies
      httpOnly `session_token` (access) e `refresh_token` (apenas com rememberMe).
    - Demais endpoints são chamados server-side (RSC/Server Actions) e o cookie
      da requisição é encaminhado como header `Cookie` pelo `kyServer`.
    - Authz é sempre do backend; o front apenas encaminha o cookie.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Mesmo origin via proxy do Next (dev) ou domínio same-site (prod)
tags:
  - name: Auth
    description: Sessão (login, logout)
  - name: Perfil
    description: Perfil do usuário autenticado
  - name: Exchanges
    description: Chaves de API de corretoras centralizadas (CEX)
  - name: Portfolio
    description: Resumo patrimonial, evolução e posições ao vivo
  - name: PerpArb
    description: Estratégias e operações de arbitragem perpétuo vs spot (Funding Arb)
  - name: ForexScalping
    description: Estratégias, sinais e operações de Scalping Forex (RSI, EMA, cTrader)
  - name: PredictionArb
    description: Arbitragem estrutural + market making em prediction markets (Polymarket)
  - name: Usuarios
    description: Manutenção administrativa de usuários
paths:
  /login:
    post:
      tags: [Auth]
      summary: Autentica o usuário e emite o cookie de sessão
      description: |
        Chamada browser-direct. Em sucesso, responde 200 e devolve o cookie
        httpOnly `session_token` (via Set-Cookie). Quando o usuário tem 2FA
        habilitado e `twoFactorToken` não é enviado, responde 401 com a mensagem
        exata `2fa_required` (o front detecta e pede o código).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login ok, cookie de sessão emitido
          headers:
            Set-Cookie:
              schema:
                type: string
              description: session_token (httpOnly, SameSite=Lax)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Credenciais inválidas, 2FA obrigatório ou código inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                credenciaisInvalidas:
                  value:
                    success: false
                    message: Credenciais inválidas.
                doisFatoresObrigatorio:
                  summary: O front detecta 2FA por esta mensagem exata
                  value:
                    success: false
                    message: 2fa_required
                codigo2faInvalido:
                  value:
                    success: false
                    message: Código 2FA inválido.
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão e limpa o cookie
      description: Chamada browser-direct. Limpa o cookie httpOnly de sessão.
      operationId: logout
      responses:
        "200":
          description: Sessão encerrada
          headers:
            Set-Cookie:
              schema:
                type: string
              description: session_token limpo (expira no passado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Sem sessão (opcional — pode ser idempotente e devolver 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil:
    get:
      tags: [Perfil]
      summary: Perfil do usuário autenticado
      operationId: getPerfil
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Perfil]
      summary: Atualiza o perfil do usuário autenticado
      operationId: updatePerfil
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilUpdateRequest"
      responses:
        "200":
          description: Perfil salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validação (nome vazio, e-mail inválido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil/senha:
    put:
      tags: [Perfil]
      summary: Altera a senha do usuário autenticado
      operationId: changePassword
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenhaChangeRequest"
      responses:
        "200":
          description: Senha alterada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Senha antiga incorreta ou não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil/2fa/gerar:
    post:
      tags: [Perfil]
      summary: Gera uma nova chave secreta para 2FA
      operationId: generate2FA
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Secret do 2FA gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorGenerateResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil/2fa/ativar:
    post:
      tags: [Perfil]
      summary: Verifica e ativa o 2FA para a conta do usuário
      operationId: activate2FA
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorVerifyRequest"
      responses:
        "200":
          description: 2FA ativado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Código 2FA inválido ou ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil/2fa/desativar:
    post:
      tags: [Perfil]
      summary: Desativa o 2FA para a conta do usuário
      operationId: deactivate2FA
      security:
        - CookieAuth: []
      responses:
        "200":
          description: 2FA desativado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /exchanges:
    get:
      tags: [Exchanges]
      summary: Lista as chaves de API CEX do usuário
      description: |
        Os campos sensíveis (`apiSecret`) NUNCA são devolvidos. O `data` do
        envelope é um array de conexões.
      operationId: listExchanges
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de conexões
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeListResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Exchanges]
      summary: Registra uma chave de API CEX
      description: |
        Recebe a chave e o segredo; o backend criptografa o segredo (AES-256-GCM)
        antes de persistir e não devolve o segredo na resposta.
      operationId: createExchange
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCreateRequest"
      responses:
        "201":
          description: Conexão criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeResponse"
        "400":
          description: Campos obrigatórios ausentes ou corretora inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Exchanges]
      summary: Atualiza uma chave de API CEX
      description: |
        Recebe o id da conexão e os campos editáveis. `apiSecret` vazio significa
        "manter o segredo atual" (o backend nunca devolve o segredo no GET).
      operationId: updateExchange
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeUpdateRequest"
      responses:
        "200":
          description: Conexão atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeResponse"
        "400":
          description: Campos obrigatórios ausentes ou corretora inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conexão não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Exchanges]
      summary: Remove uma chave de API CEX pelo id
      operationId: deleteExchange
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Id da conexão a remover
          schema:
            type: string
      responses:
        "200":
          description: Conexão removida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: id ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conexão não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /polymarket/credentials:
    post:
      tags: [Polymarket]
      summary: Salva as credenciais de automação Polymarket
      description: |
        Persiste a relayer API key, o endereço da deposit wallet e as credenciais
        L2 do CLOB. Os segredos (clobSecret/clobPassphrase) são criptografados.
      operationId: savePolymarketCredentials
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                relayerApiKey:
                  type: string
                  description: UUID da relayer API key (Settings → API Keys)
                relayerApiKeyAddress:
                  type: string
                  description: Endereço signer associado à relayer key
                depositWallet:
                  type: string
                  description: Endereço da deposit wallet (proxy)
                clobApiKey:
                  type: string
                  description: Credencial L2 do CLOB (api key)
                clobSecret:
                  type: string
                  description: Credencial L2 do CLOB (secret — criptografado)
                clobPassphrase:
                  type: string
                  description: Credencial L2 do CLOB (passphrase — criptografado)
      responses:
        "200":
          description: Credenciais salvas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Nenhum campo enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /polymarket/balance:
    get:
      tags: [Polymarket]
      summary: Sincroniza o saldo pUSD (EOA e deposit wallet)
      description: |
        Consulta on-chain (Polygon) o saldo pUSD da wallet EOA e da deposit
        wallet e atualiza o campo pusdBalance da ExchangeKey.
      operationId: syncPolymarketBalance
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Saldo atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      eoaBalance:
                        type: number
                      depositWalletBalance:
                        type: number
                      depositWallet:
                        type: string
                        nullable: true
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /polymarket/transfer:
    post:
      tags: [Polymarket]
      summary: Transfere pUSD da wallet EOA para a deposit wallet
      description: |
        Envia a transação on-chain de transferência de pUSD da EOA para a
        deposit wallet. O gas é pago em MATIC da própria EOA. Sem `amount`,
        transfere o saldo total.
      operationId: transferPusdToDepositWallet
      security:
        - CookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: Quantidade de pUSD (vazio = saldo total)
      responses:
        "200":
          description: Transferência enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      txHash:
                        type: string
                      amount:
                        type: number
                      depositWalletBalance:
                        type: number
        "400":
          description: Sem pUSD ou sem MATIC na EOA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /polymarket/deploy-wallet:
    post:
      tags: [Polymarket]
      summary: Faz o deploy da deposit wallet via relayer
      description: |
        Envia WALLET-CREATE ao relayer da Polymarket para deployar a deposit
        wallet (se ainda não existir). Requer a relayer API key salva.
      operationId: deployDepositWallet
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Deploy enviado (ou wallet já existe)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Relayer key ausente ou falha no relayer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portfolio/resumo:
    get:
      tags: [Portfolio]
      summary: Resumo patrimonial consolidado das corretoras conectadas
      description: |
        Totais de spot/futuros (USDT e USDC) somados entre as corretoras ativas,
        mais o saldo por corretora. Espelha o `/perp-arb/balances` legado.
      operationId: getPortfolioResumo
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Resumo patrimonial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResumoResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portfolio/historico:
    get:
      tags: [Portfolio]
      summary: Histórico de evolução patrimonial (snapshots)
      description: Snapshots ordenados por timestamp para o gráfico de evolução.
      operationId: getPortfolioHistorico
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHistoricoResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portfolio/live:
    get:
      tags: [Portfolio]
      summary: Portfolio ao vivo (moedas spot + posições futuras)
      description: |
        Saldo spot por moeda (quantidade + valor USD) e posições futuras abertas
        (notional, entry/mark, PnL não realizado) de todas as corretoras ativas.
      operationId: getPortfolioLive
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Portfolio ao vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioLiveResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/strategies:
    get:
      tags: [PerpArb]
      summary: Lista as estratégias de arbitragem perpétuo vs spot (Funding Arb)
      operationId: listStrategies
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de estratégias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbStrategyListResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [PerpArb]
      summary: Cria uma nova estratégia de arbitragem
      operationId: createStrategy
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerpArbStrategyCreateRequest"
      responses:
        "201":
          description: Estratégia criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbStrategyResponse"
        "400":
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [PerpArb]
      summary: Atualiza uma estratégia de arbitragem
      operationId: updateStrategy
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerpArbStrategyUpdateRequest"
      responses:
        "200":
          description: Estratégia atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbStrategyResponse"
        "400":
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Estratégia não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [PerpArb]
      summary: Remove uma estratégia de arbitragem
      operationId: deleteStrategy
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: ID da estratégia a ser removida
          schema:
            type: string
      responses:
        "200":
          description: Estratégia removida com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: ID ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Estratégia não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/trades:
    get:
      tags: [PerpArb]
      summary: Lista o histórico de transações de arbitragem
      operationId: listTrades
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbTradeListResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [PerpArb]
      summary: Limpa o histórico de transações não executadas
      operationId: deleteTrades
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Histórico de trades limpo com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/trades/resumo:
    get:
      tags: [PerpArb]
      summary: Resumo estatístico das operações encerradas (contagem, PnL total, APR, rendimento mensal e volumes de entrada/saída)
      operationId: getTradesSummary
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Resumo estatístico de trades retornado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbTradesSummaryResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /forex-arb/strategies:
    get:
      tags: [ForexScalping]
      summary: Lista as estratégias de arbitragem Forex
      operationId: getForexStrategies
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de estratégias Forex
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForexArbStrategy"
        "401":
          description: Não autenticado
    post:
      tags: [ForexScalping]
      summary: Cria uma nova estratégia Forex
      operationId: createForexStrategy
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForexArbStrategyCreateRequest"
      responses:
        "201":
          description: Estratégia Forex criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForexArbStrategy"
        "401":
          description: Não autenticado
    delete:
      tags: [ForexScalping]
      summary: Remove uma estratégia Forex
      operationId: deleteForexStrategy
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
