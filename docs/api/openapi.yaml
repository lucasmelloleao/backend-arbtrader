components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: Cookie httpOnly de sessão emitido no login
  schemas:
    # ── Envelope ──────────────────────────────────────────────────────────────
    ApiEnvelope:
      type: object
      description: Envelope padrão de toda resposta (o front assume `success` e `message` sempre presentes)
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Payload específico do endpoint (opcional)
        pagination:
          description: Presente apenas em endpoints paginados
    SuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message]
          properties:
            success:
              enum: [true]
            message:
              type: string
              example: Operação realizada com sucesso.
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message]
          properties:
            success:
              enum: [false]
            message:
              type: string
              description: Texto seguro para exibição na UI (PT-BR)
    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        twoFactorToken:
          type: string
          description: Código TOTP de 6 dígitos, enviado apenas quando o backend sinaliza 2FA
          example: "123456"
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [user]
              properties:
                user:
                  $ref: "#/components/schemas/UserPublic"
    UserPublic:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    # ── Perfil ────────────────────────────────────────────────────────────────
    PerfilResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              $ref: "#/components/schemas/Perfil"
    Perfil:
      type: object
      required: [id, nome, email]
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
          nullable: true
          description: Opcional no cadastro — pode ser null
        twoFactorEnabled:
          type: boolean
        telegramChatId:
          type: string
          nullable: true
          description: Chat ID do Telegram para notificações das operações
        telegramBotToken:
          type: string
          nullable: true
          description: >-
            Token mascarado do bot do Telegram (ex.: ***3456). O backend devolve
            apenas o sufixo; o valor integral nunca sai da persistência.
    PerfilUpdateRequest:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: "O e-mail do usuário (bloqueado para alterações)"
        telegramChatId:
          type: string
          nullable: true
          description: Chat ID do Telegram para notificações
        telegramBotToken:
          type: string
          nullable: true
          description: >-
